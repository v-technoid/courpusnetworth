<body>
<div class="shell">
  <aside class="sidebar"></aside>

  <main class="main">
    <div class="page-head">
      <h1>Liabilities</h1>
      <p>Loans and debts, with the EMI and the balance still outstanding worked out for you.</p>
    </div>

    <div class="card">
      <div class="grid-2">
        <div>
          <div class="stat-label">Total loan balance</div>
          <div class="stat-num neg" id="totalLoans" style="font-size:22px;">—</div>
        </div>
        <div>
          <div class="stat-label">Total other debt</div>
          <div class="stat-num neg" id="totalDebts" style="font-size:22px;">—</div>
        </div>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="card">
      <h2 id="formTitle">Add Entry</h2>
      <form id="entryForm"></form>
    </div>

    <div class="card">
      <h2 id="tableTitle">Your Entries</h2>
      <div id="tableWrap"></div>
    </div>

    <div class="card" id="payoff">
      <div class="card-head">
        <div><h2>Debt Payoff Planner</h2><p class="hint" style="margin:4px 0 0">Uses the loans and debts above. Every debt gets its minimum each month, and any extra goes to one debt at a time.</p></div>
      </div>
      <div class="form-row" style="max-width:520px;">
        <div><label for="poExtra">Extra you can pay each month</label><input type="number" id="poExtra" value="5000" inputmode="numeric"></div>
      </div>
      <div id="poOut" aria-live="polite"></div>
    </div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/countries.js"></script>
<script src="js/nav.js"></script>
<script src="js/finance.js"></script>
<script src="js/compute.js"></script>
<script>
const LIAB_TYPES = [
  { key:'loans', label:'Loans', computeFn: computeLoan,
    fields:[
      {id:'name', label:'Loan name', type:'text', placeholder:'e.g. Home loan'},
      {id:'principal', label:'Original loan amount', type:'number'},
      {id:'rate', label:'Interest rate (% per year)', type:'number', step:'0.1'},
      {id:'tenureMonths', label:'Total tenure (months)', type:'number'},
      {id:'startDate', label:'Start date', type:'date'}
    ],
    columns:[
      {key:'name', label:'Name'},
      {key:'principal', label:'Original amount', money:true},
      {key:'rate', label:'Rate', suffix:'%'},
      {key:'monthlyEmi', label:'EMI', money:true},
      {key:'balance', label:'Balance left', money:true}
    ]
  },
  { key:'debts', label:'Other Debts', computeFn:(e)=>e,
    fields:[
      {id:'name', label:'Debt name', type:'text', placeholder:'e.g. Credit card, personal loan'},
      {id:'amount', label:'Current outstanding amount', type:'number'},
      {id:'rate', label:'Interest rate (% per year)', type:'number', step:'0.1'},
      {id:'minPayment', label:'Minimum monthly payment', type:'number'}
    ],
    columns:[
      {key:'name', label:'Name'},
      {key:'amount', label:'Outstanding', money:true},
      {key:'rate', label:'Rate', suffix:'%'},
      {key:'minPayment', label:'Min. payment', money:true}
    ],
    note:'Update the outstanding amount yourself now and then, since this is not compounded automatically like a loan.'
  }
];

let activeType = LIAB_TYPES[0].key;
function currentConfig(){ return LIAB_TYPES.find(t => t.key === activeType); }

function renderTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '';
  LIAB_TYPES.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t.label;
    b.className = t.key === activeType ? 'active' : '';
    b.onclick = () => { activeType = t.key; renderAll(); };
    wrap.appendChild(b);
  });
}

function renderForm(){
  const cfg = currentConfig();
  document.getElementById('formTitle').textContent = 'Add ' + ({ppf:'a PPF account',epf:'an EPF account',nps:'an NPS account',fd:'a fixed deposit',rd:'a recurring deposit',stocks:'a stock',mf:'a mutual fund',gold:'gold or silver',crypto:'a crypto holding',bonds:'a bond',land:'land or property',rental:'rental income',insurance:'an insurance policy',loans:'a loan',debts:'a debt'}[cfg.key] || cfg.label.toLowerCase());
  const form = document.getElementById('entryForm');
  form.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'form-row';
  cfg.fields.forEach(f => {
    const wrap = document.createElement('div');
    const label = document.createElement('label');
    label.textContent = f.label;
    const input = document.createElement('input');
    input.type = f.type;
    input.id = 'f_' + f.id;
    if(f.step) input.step = f.step;
    if(f.placeholder) input.placeholder = f.placeholder;
    wrap.appendChild(label);
    wrap.appendChild(input);
    row.appendChild(wrap);
  });
  form.appendChild(row);

  const btnRow = document.createElement('div');
  btnRow.style.marginTop = '16px';
  const submit = document.createElement('button');
  submit.type = 'submit';
  submit.textContent = 'Add entry';
  btnRow.appendChild(submit);
  form.appendChild(btnRow);

  if(cfg.note){
    const note = document.createElement('p');
    note.className = 'hint';
    note.textContent = cfg.note;
    form.appendChild(note);
  }

  form.onsubmit = (e) => {
    e.preventDefault();
    const entry = {};
    cfg.fields.forEach(f => { entry[f.id] = document.getElementById('f_' + f.id).value; });
    addEntry(activeType, entry);
    showToast('Added.');
    renderForm();
    renderTable();
    renderTotals();
  };
}

function fmtCell(val, col){
  if(val === undefined || val === null || val === '') return '—';
  if(col.money) return fmtMoney(val);
  if(col.suffix) return val + col.suffix;
  return val;
}

function renderTable(){
  const cfg = currentConfig();
  document.getElementById('tableTitle').textContent = cfg.label;
  const data = loadData();
  const entries = data[activeType].map(cfg.computeFn);
  const wrap = document.getElementById('tableWrap');

  if(entries.length === 0){
    wrap.innerHTML = `<p class="empty">Nothing added yet. Use the form above to add your first entry.</p>`;
    return;
  }

  let html = '<table><thead><tr>';
  cfg.columns.forEach(c => html += `<th class="${c.money?'num':''}">${c.label}</th>`);
  html += '<th></th></tr></thead><tbody>';
  entries.forEach(e => {
    html += '<tr>';
    cfg.columns.forEach(c => html += `<td class="${c.money?'num':''}">${fmtCell(e[c.key], c)}</td>`);
    html += `<td class="row-actions"><button class="danger" data-del="${e.id}">Remove</button></td>`;
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => { removeEntry(activeType, btn.dataset.del); renderTable(); renderTotals(); showToast('Removed.'); };
  });
}

function renderTotals(){
  const s = computeSummary();
  document.getElementById('totalLoans').textContent = fmtMoney(s.totalLoans);
  document.getElementById('totalDebts').textContent = fmtMoney(s.totalDebts);
}

function renderAll(){ renderTabs(); renderForm(); renderTable(); renderTotals(); }
renderAll();
</script>

<script>
(function(){
  const out = document.getElementById('poOut');
  function run(){
    const debts = payoffDebts();
    if(!debts.length){ out.innerHTML = '<p class="empty">Add a loan or debt above and the plan appears here.</p>'; return; }
    const extra = Math.max(0, Number(document.getElementById('poExtra').value) || 0);
    const base = simulatePayoff(debts, 0, 'avalanche', false);
    const av = simulatePayoff(debts, extra, 'avalanche');
    const sb = simulatePayoff(debts, extra, 'snowball');
    const yrs = (m) => `${Math.floor(m / 12)} yr${Math.floor(m / 12) === 1 ? '' : 's'} ${m % 12} mo`;
    const better = av.interest <= sb.interest ? 'avalanche' : 'snowball';
    const col = (r, name, how, win) => `<div class="card" style="margin:0; ${win ? 'border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand);' : ''}">
        <div class="stat-label">${name} ${win ? '<span class="pill gold">Least interest</span>' : ''}</div>
        <p class="hint" style="margin:0 0 10px">${how}</p>
        <div class="kv"><span>Debt-free in</span><span>${r.finished ? yrs(r.months) : 'Over 50 years'}</span></div>
        <div class="kv"><span>Interest you pay</span><span>${fmtMoney(Math.round(r.interest))}</span></div>
        <div class="kv"><span>Saved vs minimums only</span><span style="color:var(--pos)">${fmtMoney(Math.max(0, Math.round(base.interest - r.interest)))}</span></div>
        <div class="hint" style="margin-top:10px"><strong>Order:</strong> ${r.order.map(o => escapeHtml(o.name) + ' (month ' + o.month + ')').join(', ')}</div>
      </div>`;
    out.innerHTML = `<div class="grid-2" style="margin-top:16px;">
        ${col(av, 'Avalanche', 'Highest interest rate first. Costs the least overall.', better === 'avalanche')}
        ${col(sb, 'Snowball', 'Smallest balance first. Quick wins that keep you going.', better === 'snowball' && sb.interest < av.interest)}
      </div>
      <p class="hint" style="margin-top:12px;">With minimum payments only you would be debt-free in ${base.finished ? yrs(base.months) : 'over 50 years'} and pay ${fmtMoney(Math.round(base.interest))} in interest. Card balances without a minimum payment are assumed to need 3% a month. ${av.interest === sb.interest ? 'Both methods pick the same order for your debts.' : ''}</p>`;
  }
  document.getElementById('poExtra').addEventListener('input', run);
  run();
  if(location.hash === '#payoff') setTimeout(() => document.getElementById('payoff').scrollIntoView({ behavior: 'smooth' }), 300);
})();
</script>
<script>if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
